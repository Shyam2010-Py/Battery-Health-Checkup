<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Dashboard illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#0a0f24"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#grid)"/>

  <!-- panel -->
  <g transform="translate(60, 60)">
    <rect width="680" height="280" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="34" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94a3b8">BATTERY MONITOR</text>
    <text x="20" y="76" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="800" fill="#22d3ee">38.1°C</text>
    <text x="20" y="106" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#fbbf24">Warm — DISCHARGING — 41%</text>

    <!-- threshold lines -->
    <g stroke-dasharray="4 4" opacity="0.4">
      <line x1="0" y1="120" x2="680" y2="120" stroke="#27c93f"/>
      <line x1="0" y1="160" x2="680" y2="160" stroke="#fbbf24"/>
      <line x1="0" y1="200" x2="680" y2="200" stroke="#a78bfa"/>
      <line x1="0" y1="240" x2="680" y2="240" stroke="#ef4444"/>
    </g>

    <!-- trend line -->
    <polyline points="0,180 60,170 120,165 180,170 240,160 300,150 360,155 420,140 480,135 540,130 600,120 660,115"
              fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- dots -->
    <g fill="#22d3ee">
      <circle cx="60" cy="170" r="3"/>
      <circle cx="300" cy="150" r="3"/>
      <circle cx="540" cy="130" r="3"/>
    </g>

    <!-- stat footer -->
    <g transform="translate(20, 220)" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#64748b">
      <text>min 35.2</text>
      <text x="80">max 42.7</text>
      <text x="160">avg 38.7</text>
      <text x="240">n = 47</text>
    </g>
  </g>

  <!-- footer label -->
  <text x="400" y="380" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748b">live · termux-battery-status · color-coded thresholds</text>
</svg>
