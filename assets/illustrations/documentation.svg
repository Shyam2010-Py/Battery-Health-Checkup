<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Documentation illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#0a0f24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- book pages -->
  <g transform="translate(220, 60)">
    <!-- left page -->
    <rect x="0" y="0" width="160" height="240" rx="6" fill="#f8fafc"/>
    <line x1="14" y1="30" x2="146" y2="30" stroke="#22d3ee" stroke-width="3"/>
    <line x1="14" y1="60" x2="130" y2="60" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="14" y1="74" x2="140" y2="74" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="14" y1="88" x2="100" y2="88" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="14" y1="118" x2="146" y2="118" stroke="#3b82f6" stroke-width="3"/>
    <line x1="14" y1="148" x2="130" y2="148" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="14" y1="162" x2="120" y2="162" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="14" y1="176" x2="140" y2="176" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="14" y1="190" x2="110" y2="190" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- right page -->
  <g transform="translate(380, 60)">
    <rect x="0" y="0" width="160" height="240" rx="6" fill="#f8fafc"/>
    <rect x="14" y="22" width="130" height="80" rx="4" fill="#0f172a"/>
    <line x1="22" y1="40" x2="100" y2="40" stroke="#22d3ee" stroke-width="2"/>
    <line x1="22" y1="56" x2="130" y2="56" stroke="#27c93f" stroke-width="2"/>
    <line x1="22" y1="72" x2="110" y2="72" stroke="#fbbf24" stroke-width="2"/>
    <line x1="22" y1="88" x2="80" y2="88" stroke="#a78bfa" stroke-width="2"/>
    <line x1="14" y1="120" x2="146" y2="120" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="14" y1="134" x2="130" y2="134" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="14" y1="148" x2="120" y2="148" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="14" y1="170" x2="140" y2="170" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="14" y1="184" x2="100" y2="184" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- spine shadow -->
  <rect x="378" y="56" width="4" height="248" fill="#94a3b8" opacity="0.3"/>

  <!-- floating symbols -->
  <g stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.7">
    <text x="80" y="100" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="800" fill="#22d3ee" stroke="none">{}</text>
    <text x="660" y="120" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="800" fill="#a78bfa" stroke="none">&lt;/&gt;</text>
    <text x="120" y="240" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="800" fill="#3b82f6" stroke="none">#</text>
    <text x="640" y="260" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#27c93f" stroke="none">$</text>
  </g>

  <!-- caption -->
  <text x="400" y="370" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94a3b8">README · GUIDE · LICENSE — fully self-documented</text>
</svg>
